services:
  api:
    build:
      context: .
      args:
        INSTALL_DL: "true"
    image: hms-eeg-api:local
    environment:
      HMS_DB_PATH: /data/hms_eeg.db
    volumes:
      - eeg_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  eeg_data:
