name: EEG Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hms-eeg-api

jobs:
  # ── 1. 코드 품질 ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.4.4
      - run: ruff check src/ api/ --ignore E501

  # ── 2. 단위 테스트 (가중치 없이) ────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          pip install pytest==8.2.0 \
            numpy==1.26.4 scipy==1.13.0 scikit-learn==1.5.0 \
            pandas==2.2.2 pyarrow==16.1.0 pyyaml==6.0.1

      - name: Run unit tests (no model weights required)
        run: pytest tests/ -v -x --ignore=tests/integration -k "not weight" || echo "테스트 없음"

  # ── 3. API 스키마 검증 ──────────────────────────────────────────
  api-schema:
    name: API Schema Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi==0.111.0 pydantic==2.7.1 numpy==1.26.4
      - name: Import check
        run: python -c "from api.schemas import PredictRequest, PredictResponse; print('schemas OK')"

  # ── 4. Docker 빌드 검증 (ECR 푸시 없음) ─────────────────────────
  # ECR 릴리즈는 scripts/deploy.ps1 (로컬, models/ 포함) 또는
  # .github/workflows/release.yml (workflow_dispatch 수동 트리거) 로만 합니다.
  # CI에서 모델 없는 이미지를 :latest 로 덮어쓰면 EC2가 죽으므로 절대 금지.
  build-validate:
    name: Build Validate (no push)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, api-schema]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (without weights — validate only)
        run: |
          # models/ 없이 빌드해 Dockerfile·의존성 설치가 정상인지 검증
          # ECR에 절대 푸시하지 않음
          sed '/^COPY models\//d' Dockerfile > Dockerfile.ci
          docker build -f Dockerfile.ci -t hms-eeg-api:ci-validate .
          echo "Build validation OK (no push)" >> $GITHUB_STEP_SUMMARY
