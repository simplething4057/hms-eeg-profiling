name: EEG Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: hms-eeg-api

jobs:
  # ── 1. 코드 품질 ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.4.4
      - run: ruff check src/ api/ --ignore E501 || true

  # ── 2. 단위 테스트 (가중치 없이) ────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: |
          pip install pytest==8.2.0 \
            numpy==1.26.4 scipy==1.13.0 scikit-learn==1.5.0 \
            pandas==2.2.2 pyarrow==16.1.0 pyyaml==6.0.1

      - name: Run unit tests (no model weights required)
        run: pytest tests/ -v -x --ignore=tests/integration -k "not weight" || echo "테스트 없음"

  # ── 3. API 스키마 검증 ──────────────────────────────────────────
  api-schema:
    name: API Schema Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install fastapi==0.111.0 pydantic==2.7.1 numpy==1.26.4
      - name: Import check
        run: python -c "from api.schemas import PredictRequest, PredictResponse; print('schemas OK')"

  # ── 4. Docker 빌드 + ECR 푸시 (main 전용) ───────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, api-schema]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 가중치는 CI 환경에 없으므로 --no-copy-models 플래그로 빌드
      # 실제 배포는 models/ 를 ECR 이미지에 포함하거나 EFS 마운트
      - name: Build image (without weights)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Dockerfile에서 COPY models/ 줄을 임시 제거한 후 빌드
          sed '/^COPY models\//d' Dockerfile > Dockerfile.ci
          docker build -f Dockerfile.ci \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_STEP_SUMMARY
