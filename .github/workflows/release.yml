name: Release to EC2

# ── 수동 트리거 전용 ─────────────────────────────────────────────────────────
# 실행 전: scripts/deploy.ps1 로 모델 포함 이미지를 ECR 에 먼저 푸시하세요.
# GitHub Actions 탭 > .github/workflows/release.yml > Run workflow
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'ECR 이미지 태그 (기본: latest)'
        required: false
        default: 'latest'

env:
  AWS_REGION:     ap-northeast-2
  ECR_REPOSITORY: hms-eeg-api
  ACCOUNT_ID:     '641150854945'
  INSTANCE_ID:    i-05475380d8e492d67
  HEALTH_URL:     http://3.38.165.173:8000/health

jobs:
  release:
    name: Release to EC2
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 1. ECR 이미지 존재 확인 ──────────────────────────────────────────
      - name: Verify ECR image exists
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>&1 || echo "NOT_FOUND")

          if [[ "$DIGEST" == "NOT_FOUND" || "$DIGEST" == "None" || -z "$DIGEST" ]]; then
            echo "ERROR: ECR image '$TAG' not found."
            echo "먼저 scripts/deploy.ps1 로 모델 포함 이미지를 ECR 에 푸시하세요."
            exit 1
          fi

          SIZE=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageSizeInBytes' \
            --output text)

          SIZE_MB=$(echo "scale=1; $SIZE/1048576" | bc)
          echo "ECR image tag=$TAG | digest=${DIGEST:0:20}... | size=${SIZE_MB} MB"

          if [[ "$SIZE" -lt 50000000 ]]; then
            echo "WARNING: image too small (${SIZE_MB} MB). May be missing deps."
            exit 1
          fi

          echo "Image check passed (${SIZE_MB} MB)" >> "$GITHUB_STEP_SUMMARY"

      # ── 2. EC2 SSM 재배포 ─────────────────────────────────────────────────
      - name: Deploy via SSM
        run: |
          ECR_URI="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${ECR_URI}/${ECR_REPOSITORY}:${{ github.event.inputs.image_tag }}"

          # 배포 스크립트의 자리 표시자를 실제 이미지 URI 로 교체 후 base64 인코딩
          sed "s|HMS_IMAGE_URI_PLACEHOLDER|${IMAGE}|g" scripts/ec2_deploy.sh > /tmp/deploy.sh
          B64=$(base64 -w0 /tmp/deploy.sh)

          # SSM 파라미터 JSON (heredoc 없이 printf 사용)
          printf '{"commands":["echo '"'"'%s'"'"' | base64 -d | bash"]}\n' "$B64" \
            > /tmp/ssm_params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file:///tmp/ssm_params.json \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $CMD_ID"

          # 완료 대기 (최대 120s)
          for i in $(seq 1 24); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "[${i}0s] SSM: $STATUS"
            if [[ "$STATUS" == "Success" ]]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" --output text
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" ]]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardOutputContent" --output text || true
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query "StandardErrorContent" --output text || true
              echo "Deploy failed (health check 실패 or 롤백)" >&2
              exit 1
            fi
          done

      # ── 3. 공개 엔드포인트 헬스체크 ────────────────────────────────────────
      - name: Public health check
        run: |
          echo "Checking: $HEALTH_URL"
          for i in 1 2 3 4; do
            sleep 5
            HTTP=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || echo 000)
            echo "[${i}0s] HTTP $HTTP"
            if [[ "$HTTP" == "200" ]]; then
              printf '\n### Deploy 완료\n| | URL |\n|---|---|\n| 대시보드 | http://3.38.165.173:8000/ui |\n| API 문서 | http://3.38.165.173:8000/docs |\n' \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "Public health check failed" >&2
          exit 1
